# Composition fixture for the PLN-0001 reference-VM slice.
#
# mkosi is a candidate fixture, not an accepted mechanism. bootc remains the
# required deployment-substrate challenger, and nothing here selects mkosi
# however many times it works.
#
# Every value must correspond to src/slice/input-set.toml. This file is the
# mechanism; that file is the declaration. If they disagree, the declaration is
# what was promised and this file is the defect.

[Config]
# The initrd is a subimage of this composition, not mkosi's synthesized default.
# PLN-0002-05 declares what is inside the signed UKI, and the initrd is inside
# it; see mkosi.images/initrd/mkosi.conf for what that declaration cost and
# bought. The dependency is explicit so the initrd is built before the UKI that
# hashes it, rather than by ordering accident.
#
# compose.sh supplies Initrds= on the command line, because mkosi has no
# specifier for the output directory.
Dependencies=initrd

[Distribution]
Distribution=fedora
Release=44

# LocalMirror, not Mirror. Mirror keeps mkosi's default repository set, which
# for Fedora enables `updates` -- a continuously republished repository that
# cannot be an exact input and that the declaration deliberately excludes.
# LocalMirror makes the single declared repository the only one that exists, so
# the declaration is enforced by construction rather than by convention.
LocalMirror=https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os

[Output]
Format=disk
Output=neutrinos-slice

# The composition record is part of the deliverable, not an optional flag
# someone remembers to pass. This emits the resolved package set with exact
# versions, which is what SYS-058 asks composition to retain.
ManifestFormat=json
# OutputDirectory is supplied by compose.sh. Build artifacts never enter the
# checkout; the hygiene contract's binary and size bounds bind here first.

# systemd-repart derives partition and filesystem UUIDs from this seed by
# cryptographic hashing rather than randomly. Measured: the btrfs filesystem
# UUID is now identical across builds, so this setting does real work.
#
# It is not sufficient on its own for a bit-identical `.raw`, and it never was
# the whole story. The remaining cause was located on 2026-08-12 and is the FAT
# volume-label timestamp mkfs.fat stamps from the wall clock; it is addressed by
# the [Build] Environment= block at the end of this file, not from here. Read
# the reproducibility claim off that block and off the measurement it cites,
# never off the presence of this setting.
#
# It sits in [Output] because that is where mkosi parses it. It was in [Content]
# from PLN-0001 until PLN-0002-02, where mkosi's own warning about it was
# noticed; the value and its effect are unchanged.
Seed=3f2a6d1c-8e4b-4a7f-9c15-2b6d0e5a71c4

[Content]
Bootable=yes

Packages=systemd,systemd-boot,systemd-udev,kernel-core,util-linux-core,dbus-broker

# The PLN-0001-04 amendments were reverted on 2026-08-10 by owner decision,
# after RES-0013 measured that none of them is necessary for reachability. A
# console, first-boot answers, a hostname, and an unlocked root account all
# arrive from outside as SMBIOS Type 11 credentials, supplied by the harness in
# tools/validation/slice_boot.py. The artifact carries none of them.
#
# What was removed: KernelCommandLine, Timezone, Locale, Hostname, RootPassword,
# Autologin. Reverting is verified by identity, not by inspection -- the UKI
# hashes back to 575c847d... and the initrd to e7061e25..., the digests recorded
# before the amendment.
#
# This does not settle where first-boot configuration belongs. A physical host
# has no harness to inject SMBIOS strings, so the installer, the enrollment
# record, or the image must still own it; that is L-003 and C-002. What is
# settled is that "the image must carry it or the VM is unreachable" is false.
#
# The kernel command line is the one amendment with an independent argument: a
# cmdline inside the UKI is measured as part of the signed image, while an
# SMBIOS extra is host-supplied and lands in PCR12. Which a NeutrinOS deployment
# should rely on is a boot-integrity question, open and not decided here.

# PLN-0002-04 reintroduces a kernel command line, and it is not a reversal of
# the above. What was reverted was first-boot *configuration* -- timezone,
# locale, hostname, root password, autologin -- on the finding that none of it
# is necessary for reachability. This is structural instead: with the
# authenticated artifact reduced to /usr, `root=tmpfs` is what makes the initrd
# create a root for /usr to be mounted into, and without it the artifact cannot
# mount itself. mkosi supplies the other half, parsing the root hash out of
# repart's JSON and injecting `usrhash=` into every UKI it builds, which is what
# makes that mount verity-authenticated rather than merely successful.
#
# Nothing else is added. No console= : PLN-0001 established that the harness
# supplies what the harness needs, and that finding is left intact.
#
# The tmpfs root is an owner ruling of 2026-08-11 and a fixture. Nothing
# persists, so no machine-state volume is built and DES-0006 C-008 is respected
# by not implementing the thing it governs. The persistence question stays open.
#
# systemd.image_policy=usr=signed. Declared by PLN-0002-05, ruled 2026-08-12,
# and landed here by PLN-0002-06b now that the signature partition exists.
#
# It is embedded in the UKI rather than appended at boot. Every measurement that
# established what it does rode io.systemd.stub.kernel-cmdline-extra, which stub
# honours alongside this section even under Secure Boot -- verified, not assumed.
# That is correct for measuring a designator and wrong for shipping one: a
# host-supplied append is outside the UKI's signature, so a loader could drop the
# policy the artifact claims to carry.
#
# What it does, measured across both enrollment arms on 2026-08-14, because an
# earlier draft of this comment asserted the opposite and was wrong:
#
#   - `usr=signed` is a STRUCTURAL predicate. dissect-image.c sets the SIGNED
#     flag when the signature partition is *found* -- no verification, no
#     keyring. Our image satisfies it whether the verity signer is enrolled or
#     not, so this does not discriminate on trust.
#   - It is evaluated by systemd-gpt-auto-generator, which on our boot path runs
#     at ~5.25s in the real root, after the initrd mounted /usr at ~2.4s, and
#     whose non-zero exit is non-fatal. A mismatch logs "Image does not match
#     image policy" and the machine boots.
#   - Naming usr-verity= or usr-verity-sig= would make this WORSE. `signed` is a
#     flag of the data partition; on a verity partition it sets no flags, and
#     systemd.image-policy(7) says no flags implies `open` -- which permits
#     absent. Left unnamed, their policy is derived from usr='s minimum
#     protection level, which is the constraint actually wanted.
#
# So this is worth having and is not the integrity mechanism. It is a structural
# assertion, bound to the artifact by the UKI signature.
#
# Where enforcement actually lives is an OPEN QUESTION, not settled here.
# systemd-veritysetup, on a signature the kernel refuses, retries without it,
# succeeds, and reports the unit Finished -- so a bad signer does not stop the
# boot. The outcome is recorded instead: `signed_activation` feeds
# pcrextend_verity_now(), so a signed activation and an unsigned fallback extend
# different PCR values. systemd's enforcement point is the unseal, not the mount.
# That is TPM policy, which PLN-0002 lists as out of scope, so it is flagged for
# review rather than designed around.
#
# What this replaces is worth stating. Today NeutrinOS asserts /usr integrity
# **by having mounted it**, and PLN-0002-01 showed that to be the unsafe claim:
# dm-verity verifies lazily, per block, on read, so a corrupt artifact booted
# normally. This line does not close that. It narrows what the artifact may
# structurally be; the lazy-verification gap is carried forward.
KernelCommandLine=root=tmpfs
                  rw
                  systemd.image_policy=usr=signed

# Timestamps are an input to output identity. Fixing the epoch removes build
# time as a source of difference so that PLN-0001-07's reconstruction compares
# content rather than clocks.
SourceDateEpoch=0

# The declared initrd module list. PLN-0002-05, ruled 2026-08-12.
#
# It lives here, on the main image, and not in mkosi.images/initrd/mkosi.conf
# where it was first written -- and that correction is the whole reason this
# comment is long.
#
# `KernelModulesInitrd=yes` makes mkosi build a **second** cpio, from the main
# image's kernel modules, and concatenate it with the initrd. That second cpio
# is selected by KernelModulesInitrdInclude=/KernelModulesInitrdExclude= here,
# not by the initrd image's own KernelModules=. Left unset it takes everything
# the kernel package ships.
#
# Measured, after the first attempt put the list in the initrd subimage: that
# initrd contained **no kernel modules at all** -- it has no kernel package, so
# there was nothing for its KernelModules= to select -- while the composed
# initrd was 113.5M against the subimage's 35.9M. The missing 77M was every
# module in the kernel, arriving through this setting. The trim had no effect on
# the artifact, and upstream's 98-module list was never governing it either.
#
# The list is identical across both arms by owner ruling, so the initrd is a
# held constant and the comparison isolates the filesystem. The two filesystem
# drivers are not symmetric: erofs is required by **both** arms, because the
# confext is itself an erofs DDI and the merge runs in the initrd, while ext4 is
# required by one. A later trim reasoning from the arm alone would drop erofs
# from the ext4 initrd and break the confext merge rather than the boot, which
# is the silent direction.
#
# Not yet confirmed. A boot of both arms is PLN-0002-05's acceptance evidence
# and is owed before PLN-0002-06 freezes the artifacts.
KernelModulesInitrdInclude=
        # Virtual hardware. QEMU with virtio; no SCSI, no NVMe, no physical
        # storage or input path.
        virtio_pci
        virtio_blk
        virtio_console
        virtio-rng
        qemu_fw_cfg

        # Harness readiness over a notify vsock rather than console scraping.
        vsock
        vmw_vsock_virtio_transport

        # The authenticated /usr. Signature validation itself needs no module:
        # CONFIG_LOAD_UEFI_KEYS=y and
        # CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG_PLATFORM_KEYRING=y are built in,
        # verified offline against kernel-core 6.19.10-300.fc44.
        dm-mod
        dm-verity
        crypto/

        # Both arms' filesystems. See above: erofs is needed by both.
        erofs
        ext4

        # The ESP, and the character set the FAT driver needs to read it.
        vfat
        /fs/nls/

        # The confext merge. `loop` attaches the DDI; `overlay` is the merge.
        loop
        overlay

        # Firmware variables, for the Secure Boot state the harness asserts.
        efivarfs

# Deliberately excluded, so the exclusion is a decision rather than an
# oversight: tpm_tis and the TPM path. The fixture has no TPM, PLN-0001-04's
# standing finding is that the tss2 runtime libraries are absent from the
# closure while systemd is built +TPM2, and T4-SLICE-001 currently fails on two
# systemd 261 TPM units. Adding the module would not fix that and would obscure
# it.

# Build caches and database journals, not image content. Measured across two
# directory builds, these were the only four files of 7780 that differed; all
# other content and all file metadata were bit-identical.
#
# These have NO effect on the shipped disk image. mkosi's CleanPackageMetadata
# defaults to auto, which removes the package databases outright when the
# package manager is not installed -- but skips that removal for `directory`
# and `tar` output. So the disk image never contains these files, and this
# setting exists only to keep the two-directory-build comparison, which is how
# reproducibility is actually measured, from reporting spurious differences.
# See the composition record and the identity report.
#
# The three sqlite sidecars are write-ahead-log and shared-memory files left
# behind because the package databases were not closed cleanly. Checkpointing
# the dnf history WAL reports zero live frames and leaves the database
# byte-identical, so these hold no committed data and removing them discards
# nothing. The ldconfig cache is regenerated at runtime.
RemoveFiles=/var/cache/ldconfig/aux-cache
            /usr/lib/sysimage/rpm/rpmdb.sqlite-shm
            /usr/lib/sysimage/rpm/rpmdb.sqlite-wal
            /usr/lib/sysimage/libdnf5/transaction_history.sqlite-shm
            /usr/lib/sysimage/libdnf5/transaction_history.sqlite-wal

[Validation]
# Sign the UKI. Synthetic material, generated into the build root by compose.sh
# and passed on the command line; the paths are not named here because they live
# outside the checkout and this file must stay build-root-agnostic.
#
# First written under [Content], which mkosi warns about. The warning is only a
# warning: config.py parses every valid section and applies the setting anyway,
# so the misplacement changed nothing about the artifact. Corrected because a
# config file that disagrees with the tool about where a setting lives is a
# defect waiting to become real, not because it was breaking anything.
#
# Nothing here is a production signing path and none of this material is a trust
# anchor. PLN-0002's boundary forbids production signing, Secure Boot,
# enrollment, or credential authority, and none is exercised: the keys are
# synthetic, they are enrolled only into a disposable VM's firmware variables,
# and they are destroyed with the build root.
#
# Signing the UKI does not make /usr trustworthy. It binds the root hash and the
# kernel command line -- including the image policy -- to a signature the
# firmware checks. What happens to an artifact whose verity signer is untrusted
# is a separate question, and PLN-0002-06 is measuring it.
SecureBoot=yes

[Build]
# Filesystem options systemd-repart cannot be told through a repart.d file.
# Both are PLN-0002-05 parameter rulings of 2026-08-12, and both land here
# rather than in mkosi.repart.*/ because repart takes them only through the
# environment. mkosi puts Environment= into the env it runs repart with -- the
# same path SOURCE_DATE_EPOCH already travels -- so this reaches mkfs.
#
# The variable name is SYSTEMD_REPART_MKFS_OPTIONS_<FSTYPE>, built by systemd
# as "SYSTEMD_" + component + "_MKFS_OPTIONS_" + fstype. Do not copy the name
# from mkosi: it spells its own ext4 workaround SYSTEMD_REPART_MKFS_EXT4_OPTIONS,
# which systemd does not recognise, so that workaround does nothing at this pin.
# Both spellings were tested; only the one used here has any effect.
#
# Quoted because Environment= splits on whitespace with shlex, so an unquoted
# value would parse as several variables.
#
# --invariant is the last 2 bytes of ESP nondeterminism. Measured rather than
# reasoned: with a fixed input tree and a fixed volume ID, two builds differ by
# 18 bytes without SOURCE_DATE_EPOCH, by 2 with it, and by the same 2 when no
# file is copied at all. mtools 4.0.49 honours SOURCE_DATE_EPOCH and mkosi
# already exports it, so mcopy was never the problem; mkfs.fat 4.2 (2021-01-31)
# is, and it has no SOURCE_DATE_EPOCH support. The two bytes are the creation
# and write time of the FAT volume-label directory entry, stamped from the wall
# clock. 4.2 is upstream's newest release, not a Fedora lag, and the fix for
# this sits unreleased on dosfstools master, so this flag is the lever that
# exists.
#
# -i is paired with it deliberately, following the recipe at
# reproducible-builds.org/docs/system-images. --invariant alone also replaces
# repart's seed-derived volume ID with dosfstools' hardcoded 1234abcd; repart
# appends these options after its own -i, so the explicit one here wins. The
# ID stops being seed-derived and becomes declared, which is the trade. 4E455554
# is "NEUT". Verified through repart: 2 differing bytes become 0, and the
# volume ID reads back as 4e455554.
#
# ^has_journal removes the journal outright -- the feature bit is absent and
# there is no journal inode, not a journal left disabled. 16M on a partition
# that is mounted read-only under dm-verity and can never write, which is 16M
# of a measured size criterion. Same principle that declared the EROFS arm
# compressed: measure the arm as it would ship. It applies to the ext4 arm and
# is inert for the EROFS one.
Environment="SYSTEMD_REPART_MKFS_OPTIONS_VFAT=--invariant -i 4E455554"
            "SYSTEMD_REPART_MKFS_OPTIONS_EXT4=-O ^has_journal"
