# The role's one user account, created declaratively at boot rather than baked
# into the image. systemd-sysusers reads this from /usr, so the account is part
# of the authenticated release artifact and not part of any writable state.
#
# Moved 2026-08-18 out of mkosi.extra.session into its own tree: the `workload`
# variant (C-009) needs this account too -- capability.containers' assert names
# it as "the session user" and a rootless container has to run as somebody --
# and workload does not add mkosi.extra.session, on purpose (compose.py: a
# container workload should not depend on a compositor coming up first). One
# account declaration shared by both, rather than two copies that could drift.
#
# No password is set here and none is set anywhere in the image. The harness
# supplies credentials, as it does the hostname and the machine-id; a password
# inside a release artifact would be a shared secret shipped to every machine.
#
# The UID is fixed rather than allocated. /home is a separate volume that is
# meant to outlive a reinstall, so an allocated UID that drifted between
# installations would leave a home directory owned by nobody.
u neutrinos 1000 "NeutrinOS session user" /home/neutrinos /usr/bin/bash

# seat and input access for the compositor, and video for the DRM device.
m neutrinos video
m neutrinos input
