# Subordinate UID/GID range for rootless Podman (capability.containers, C-009).
#
# systemd-sysusers has no equivalent of this: its own `r` line type reserves a
# range for *allocating new system UIDs from*, which is a different pool and
# does not touch /etc/subuid or /etc/subgid -- checked against upstream's
# sysusers.d documentation 2026-08-18 rather than assumed, after a boot probe
# found rootless podman falling back to single-UID-mapping mode with no
# subordinate range for `neutrinos`.
#
# /etc/subuid and /etc/subgid are the classic shadow-utils files, normally
# populated by `useradd` at account-creation time. This account is created
# declaratively by systemd-sysusers, not useradd, so nothing ever wrote them.
# `f+` creates-or-truncates and writes the argument every boot, which is the
# same "declared in /usr, materialized into /etc at boot" shape the rest of
# this account's files use -- one user, one range, not a general allocator.
#
# 100000:65536 is the conventional shadow-utils default range and does not
# collide with any other declared UID (root is 0, neutrinos is 1000).
f+ /etc/subuid 0644 root root - neutrinos:100000:65536
f+ /etc/subgid 0644 root root - neutrinos:100000:65536

# Populating the files above is not sufficient by itself -- measured
# 2026-08-18: getsubids still reports "Error fetching ranges" with both files
# correctly populated. Current shadow-utils dispatches subuid/subgid lookups
# through libsubid over NSS rather than reading the classic files directly,
# and Fedora 44's shipped /etc/nsswitch.conf carries no `subid:` line.
#
# Not fixed here, and not fixed in mkosi.finalize either -- tried and reverted
# 2026-08-18. /etc/nsswitch.conf is a symlink to /etc/authselect/nsswitch.conf,
# and /etc/authselect is itself a whole directory symlinked into
# /usr/share/factory/neutrinos-etc as one unit (disposition `L`, read-only) --
# not `C` as current-context.md's C-010 finding currently states, measured
# against the generated tmpfiles fragment directly, a discrepancy worth
# checking independently of this. A tmpfiles rule cannot append into that
# chain without either restating the whole authselect directory's disposition
# (a PLN-0002-03a carve question, not a role-package concern) or patching the
# nested factory file directly in mkosi.finalize -- both deferred rather than
# decided unilaterally here.
#
# Net effect: rootless Podman runs in single-UID fallback mode rather than
# full subordinate-range remapping (podman info still exits 0).
# capability.containers' assert is "a bind-mounted source tree writable from
# inside" -- single mapping does not fail that; it means the container sees
# UID 1000 rather than a remapped range, which if anything makes a
# bind-mounted UID-1000-owned tree *more* trivially writable, not less.
# Flagged, not solved.
