# Subordinate UID/GID range for rootless Podman (capability.containers, C-009).
#
# systemd-sysusers has no equivalent of this: its own `r` line type reserves a
# range for *allocating new system UIDs from*, which is a different pool and
# does not touch /etc/subuid or /etc/subgid -- checked against upstream's
# sysusers.d documentation 2026-08-18 rather than assumed, after a boot probe
# found rootless podman falling back to single-UID-mapping mode with no
# subordinate range for `neutrinos`.
#
# /etc/subuid and /etc/subgid are the classic shadow-utils files, normally
# populated by `useradd` at account-creation time. This account is created
# declaratively by systemd-sysusers, not useradd, so nothing ever wrote them.
# `f+` creates-or-truncates and writes the argument every boot, which is the
# same "declared in /usr, materialized into /etc at boot" shape the rest of
# this account's files use -- one user, one range, not a general allocator.
#
# 100000:65536 is the conventional shadow-utils default range and does not
# collide with any other declared UID (root is 0, neutrinos is 1000).
f+ /etc/subuid 0644 root root - neutrinos:100000:65536\n
f+ /etc/subgid 0644 root root - neutrinos:100000:65536\n

# The trailing `\n` on each argument above is load-bearing, and its absence
# was the whole of the 2026-08-18 failure. systemd-tmpfiles writes an `f+`
# argument verbatim, with no newline appended (measured against systemd 261,
# the version this slice bumped to). shadow-utils reads /etc/subuid through
# commonio, which requires every line to be newline-terminated and rejects the
# entire file otherwise -- it reports `/etc/subuid: Non-text file.` and
# getsubids then prints `Error fetching ranges` and exits 1.
#
# Measured 2026-08-18, systemd 261 + shadow 4.20, bind-mounting each variant
# over /etc/subuid in a user namespace:
#
#   argument without \n   file has no trailing newline   getsubids exits 1
#   argument with   \n   file ends in a newline          getsubids exits 0
#
# The earlier diagnosis in this file blamed the missing `subid:` line in
# Fedora 44's /etc/nsswitch.conf, and it was wrong. That was falsified
# directly: the host running this test also has no `subid:` line in
# /etc/nsswitch.conf, and `getsubids` resolves ranges there without one.
# libsubid only dispatches over NSS when nsswitch.conf names a subid source;
# with no such line it reads the classic files, which is the path in use here.
#
# So /etc/authselect's disposition is NOT implicated, nothing needs to append
# into that symlink chain, and this does not depend on the PLN-0002-03a carve.
# Do not reopen that question on this file's account.
#
# One discrepancy found while chasing the wrong diagnosis is real and is NOT
# resolved here: mkosi.finalize's `writable_in_etc` list does not contain
# `authselect`, so the generator emits `L /etc/authselect`, while
# current-context.md's C-010 standing finding states `C /etc/authselect`.
# That is a records question for the owner, independent of subid.
