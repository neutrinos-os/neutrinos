# The session account, created declaratively at boot rather than baked into the
# image. systemd-sysusers reads this from /usr, so the account is part of the
# authenticated release artifact and not part of any writable state.
#
# No password is set here and none is set anywhere in the image. The harness
# supplies credentials, as it does the hostname and the machine-id; a password
# inside a release artifact would be a shared secret shipped to every machine.
#
# The UID is fixed rather than allocated. /home is a separate volume that is
# meant to outlive a reinstall, so an allocated UID that drifted between
# installations would leave a home directory owned by nobody.
u neutrinos 1000 "NeutrinOS session user" /home/neutrinos /usr/bin/bash

# seat and input access for the compositor, and video for the DRM device.
m neutrinos video
m neutrinos input
