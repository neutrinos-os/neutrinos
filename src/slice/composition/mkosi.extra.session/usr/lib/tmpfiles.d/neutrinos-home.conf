# The home directory, on the home volume. sysusers declares the account and its
# home path; it does not create the directory, and on this system it could not:
# /home is a separate partition that is not mounted when sysusers runs.
#
# tmpfiles runs after local-fs.target, so this lands on the mounted volume. If
# the home volume ever fails to mount, this creates a directory on the tmpfs
# instead and the session works exactly once -- which is the same silent shape
# T4-STATE-001 exists to catch, and the reason that check asserts the mount.
d /home/neutrinos 0700 neutrinos neutrinos -
