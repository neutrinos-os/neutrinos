# The NeutrinOS initrd. PLN-0002-05.
#
# This replaces an additive cpio written into $ARTIFACTDIR/io.mkosi.initrd by a
# finalize script. That route could only *add* files; it could not touch the
# configuration mkosi's default initrd is built from, and PLN-0002-05 has to
# declare what is inside the signed UKI. Once the default initrd's own package
# set and module list became declared parameters, "the default plus two files"
# stopped being a smaller declaration than this file. Owner ruling 2026-08-12.
#
# Two costs come with it and both are accepted. `Initrds=` has no output
# directory specifier -- mkosi's specifiers are %C, %P, %D, %F and %I, none of
# which names the output directory -- so the path is passed from compose.sh.
# And setting `Initrds=` makes want_default_initrd() return False, so this image
# is no longer an addition to mkosi's initrd: it is the initrd.

[Include]
# The same mkosi-initrd the default route used. finalize_default_initrd()
# parses resources/mkosi-initrd in place, so this is not a reimplementation --
# it is the identical configuration, invoked explicitly so it can be edited.
#
# Subimages inherit Distribution=, Release=, LocalMirror=, ToolsTree= and
# PackageDirectories= as universal settings, so the frozen repository and the
# declared overlay reach this image without being restated. That inheritance is
# load-bearing: an initrd resolving from a different repository than the artifact
# would be an undeclared input in the one place the signature covers.
Include=mkosi-initrd

[Content]
# Reset, and do not re-declare. An empty assignment resets a list setting in
# mkosi, so this drops mkosi-initrd's 92 modules rather than appending to them.
#
# The declared list is **not** here. It is `KernelModulesInitrdInclude=` on the
# composition, and putting it here instead was the first attempt and was wrong:
# this image has no kernel package, so its KernelModules= selects from nothing.
# Measured -- the initrd this file builds contained zero kernel modules while
# the composed initrd was 113.5M, the difference being every module in the
# kernel arriving through the main image's KernelModulesInitrd=yes.
#
# So the reset is all this needs to do, and it is still worth doing: upstream's
# list is general-purpose, carrying btrfs, squashfs and xfs into an artifact
# that mounts none of them. Leaving it would leave a second module list that
# looks authoritative and is not.
KernelModules=

# The packages and RemoveFiles= sets are mkosi-initrd's, unchanged and declared
# as inherited. Trimming `bash` and `less` would save build time against an
# emergency-login capability this plan is likely to want the first time a boot
# fails before /usr.

# SourceDateEpoch is deliberately absent, and it is not an omission: mkosi
# rejects it here -- "cannot be configured in initrd image" -- because it is a
# universal setting inherited from the composition. The composition sets 0, so
# this image gets 0. Stated because the initrd is hashed into the UKI and the
# UKI's identity is what PLN-0001-07 verifies a reconstruction against, which
# makes the epoch load-bearing here even though it cannot be declared here.
