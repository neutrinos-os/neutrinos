# Bind the factory replay to the initrd confext merge. PLN-0002-03a.
#
# neutrinos-etc-factory.service declares Before= on this unit, but ordering
# alone decides nothing about whether it runs: if the merge unit is pulled into
# the boot transaction and the replay unit is not, /etc is empty when the merge
# happens and Before= is satisfied vacuously.
#
# Requires= rather than Wants=, so the merge does not proceed over a replay that
# failed. See the failure recorded in the replay unit.
#
# Be precise about how much that buys, because it was measured and it is less
# than it looks. This guards the *initrd* merge only. On a boot where the replay
# failed, /etc still ended up overmounted by the confext -- the post-switch-root
# systemd-confext.service merged it, and that unit has no such dependency and no
# way to acquire one, since the replay unit does not exist after switch-root.
#
# So this is fail-closed for the merge point it names and not for the hierarchy.
# Closing the second one is not in PLN-0002-03a's carve; it is noted here so the
# gap is visible at the place that looks like it covers it.
[Unit]
Requires=neutrinos-etc-factory.service
After=neutrinos-etc-factory.service
