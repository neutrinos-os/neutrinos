# The authenticated release artifact, EROFS arm. Under DES-0006 C-013 this is
# the whole of it: there is no root image, and this partition carries no
# configuration and no state. PLN-0002-02 is what made that true of the content
# -- 1352 entries left /etc, into this partition's /usr/lib and /usr/share or
# into nothing.
#
# Format= is the variable under test, and this directory is one of its two
# values. The shared mkosi.repart/ holds every partition that is identical
# across arms -- the ESP and the verity hash -- and compose.sh passes exactly
# one arm directory beside it, selected by NEUTRINOS_SLICE_ARM. Two directories
# rather than one file with a switch, because there is no switch: a repart
# definition is static configuration read by systemd-repart, which does no
# substitution, and the arm has to be reviewable as the artifact it produces.
#
# There is deliberately no 10-usr.conf in the shared directory. Both arm
# directories use the same filename, and only one is ever passed, so nothing
# here depends on systemd's masking order between definition directories.
#
# Reading EROFS as a selection is the exact error the plan's candidate-status
# paragraph warns about. PLN-0002 exists to answer C-007 by measuring this
# against ext4; PLN-0002-13 is where a decision would be recorded.
[Partition]
Type=usr
Label=neutrinos-usr
Format=erofs
CopyFiles=/usr:/

# Compression. PLN-0002-05, ruled 2026-08-12, and it fixes a defect rather than
# tuning a knob: systemd-repart passes -z to mkfs.erofs **only** when the
# partition sets Compression=, and this file set neither it nor
# CompressionLevel=. So the EROFS arm was an uncompressed image being compared
# against ext4 on image size and update transfer size -- two of C-007's eight
# criteria -- with the format's principal advantage switched off. Nothing
# declared it and no measurement would have exposed it, because an uncompressed
# EROFS image is not an error, just a different artifact than anyone would
# deploy.
#
# lz4hc, because it compresses harder than lz4 at the same decompression cost
# and decompression is what the boot path pays on every read. zstd and lzma
# compress better and cost more per read, which would move four measured
# criteria at once and in opposite directions.
#
# Level 12 is the top of lz4hc's range. Build time is measured separately as its
# own criterion, so paying it here appears in the results rather than
# disappearing into them.
#
# Read the image-size result carefully: with this set, part of any EROFS win is
# compression rather than on-disk format, and PLN-0002-13's recommendation has
# to say so. ext4 cannot compress, so there is no matching setting on that arm.
#
# Available in the pinned builder: repart's Compression= is documented "Added in
# version 257" and the tools tree resolves systemd 259.5.
Compression=lz4hc
CompressionLevel=12

# The verity pair. VerityMatchKey= is what associates this partition with its
# hash partition; systemd-veritysetup-generator then derives both partition
# UUIDs from the two halves of the root hash, so a command line naming a hash
# finds its own partitions and cannot be pointed at someone else's.
#
# Identical in the ext4 arm, and it has to be: the verity pairing is not a
# property of the filesystem, and a difference here would move a second
# variable alongside Format=.
Verity=data
VerityMatchKey=usr

# Sizing to contents. Like the ESP, this is a fixture and not a measurement:
# PLN-0002-07 measures image size as one of C-007's eight criteria, and it
# measures it under the parameters PLN-0002-05 declares, not under this.
Minimize=guess
