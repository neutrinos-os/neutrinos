# The authenticated release artifact, ext4 arm. The companion of
# mkosi.repart.erofs/10-usr.conf: same partition, same role, one setting
# different. Read the two side by side -- the diff between them is the whole of
# what PLN-0002 is measuring, and anything else that drifts apart here is a
# second variable and voids the comparison.
#
# compose.sh passes exactly one of the two arm directories beside the shared
# mkosi.repart/, selected by NEUTRINOS_SLICE_ARM. Both files are named
# 10-usr.conf and the shared directory has no file of that name, so nothing
# depends on systemd's masking order between definition directories.
[Partition]
Type=usr
Label=neutrinos-usr
Format=ext4
CopyFiles=/usr:/

# No Compression=, and its absence is declared rather than omitted. ext4 does
# not compress, so there is no matching setting to the EROFS arm's lz4hc/12 and
# no way to make the two arms symmetric on this axis. PLN-0002-05 records the
# consequence: part of any EROFS win on image size and update transfer size is
# compression rather than on-disk format, and PLN-0002-13's recommendation must
# say so rather than reporting a format result.
#
# What mkosi's builder passes to mke2fs is fixed and not ours here: block size
# 4096, inode size 256 and reserved blocks 0%. All three are declared as
# builder-fixed in docs/project/artifact-parameter-declaration.md, measured from
# systemd v259's src/shared/mkfs-util.c rather than assumed, and confirmed on
# the built arm with dumpe2fs. Inode ratio is not passed at all and comes from
# e2fsprogs' mke2fs.conf `default` type; it is declared as inherited.
#
# This comment used to claim a fourth: "-O verity added because this is a verity
# data partition". That was written from reasoning and is false. ext4's `verity`
# feature is fs-verity, which authenticates individual files; this partition is
# authenticated by dm-verity, a block-level hash tree in its own partition named
# on the kernel command line. repart has no reason to pass -O verity and does
# not, and the built filesystem has no such feature. The declaration records the
# retraction; it is repeated here because a config comment is what gets read at
# the point of change.
#
# The journal is removed through SYSTEMD_REPART_MKFS_OPTIONS_EXT4 in the
# composition's Environment=, not from here, because repart takes it only from
# the environment. One consequence worth naming where the feature set is
# described: orphan_file requires a journal, so removing the journal removes it
# too, and the built arm has neither.

# The verity pair, identical to the EROFS arm by requirement rather than by
# copy. The pairing is not a property of the filesystem, so a difference here
# would move a second variable alongside Format=.
Verity=data
VerityMatchKey=usr

# Sizing to contents, identical to the EROFS arm. A fixture, not a measurement:
# PLN-0002-07 measures image size under the declared parameters, not under this.
Minimize=guess
