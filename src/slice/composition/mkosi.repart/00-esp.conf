# The ESP carries the signed UKI and the bootloader, and nothing else. It is
# unauthenticated by construction. What protects it is that the UKI it holds is
# signed and the firmware checks that signature -- not that this partition is
# trusted, which it is not and cannot be.
#
# Promoted from the PLN-0002-01 spike by PLN-0002-04, where it booted. It is a
# fixture: PLN-0002 selects no partition layout, and `S-004` is open.
[Partition]
Type=esp
Format=vfat

# Both, not just /boot. mkosi stages the UKI under /boot and the bootloader
# under /efi; copying only /boot produced an ESP with a valid UKI and no
# EFI/BOOT/BOOTX64.EFI, so the firmware fell through to PXE and the artifact
# looked unbootable for a reason that had nothing to do with /usr. Measured,
# not anticipated.
CopyFiles=/boot:/
CopyFiles=/efi:/

# Fixed, and slack rather than a measurement. Sizing that means anything is
# PLN-0002-05's, and an ESP sized to its contents would differ between the two
# arms for reasons that are not about the arms.
SizeMinBytes=512M
SizeMaxBytes=512M
