# The authenticated release artifact. Under DES-0006 C-013 this is the whole of
# it: there is no root image, and this partition carries no configuration and no
# state. PLN-0002-02 is what made that true of the content -- 1352 entries left
# /etc, into this partition's /usr/lib and /usr/share or into nothing.
#
# Format= is the variable under test. EROFS here is the arm PLN-0002-01 booted,
# not a selection: PLN-0002 exists to answer C-007 by measuring this against
# ext4, and PLN-0002-05 declares every parameter of both arms before PLN-0002-06
# builds either. Reading this line as a decision is the exact error the plan's
# candidate-status paragraph warns about.
[Partition]
Type=usr
Label=neutrinos-usr
Format=erofs
CopyFiles=/usr:/

# The verity pair. VerityMatchKey= is what associates this partition with its
# hash partition; systemd-veritysetup-generator then derives both partition
# UUIDs from the two halves of the root hash, so a command line naming a hash
# finds its own partitions and cannot be pointed at someone else's.
Verity=data
VerityMatchKey=usr

# Sizing to contents. Like the ESP, this is a fixture and not a measurement:
# PLN-0002-07 measures image size as one of C-007's eight criteria, and it
# measures it under the parameters PLN-0002-05 declares, not under this.
Minimize=guess
