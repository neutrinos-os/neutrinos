# The hash tree. Its root hash is what the signed UKI carries on the kernel
# command line, and that is the binding C-013 relies on: the signature covers
# the command line, the command line names the root hash, the root hash covers
# every block of the usr partition.
#
# PLN-0002-01 measured a limit of that chain which this file cannot fix and
# which every later task inherits. dm-verity verifies lazily, per block, on
# read. A block nothing reads is never checked, so a machine that boots proves
# only that the blocks the boot happened to read are intact. A flipped byte
# inside this partition's data booted normally and was diagnosed precisely --
# `device-mapper: verity: data block 1000 is corrupted` -- but only once
# something read it. "It booted" is not a statement about the artifact.
[Partition]
Type=usr-verity
Label=neutrinos-usr-verity
Verity=hash
VerityMatchKey=usr

# The hash tree needs room. Left unsized, repart allocates the 4K default and
# fails with "Partition 2's contents (1.9M) don't fit in the partition (4K)".
# 64M is slack, not a measurement. Real sizing is PLN-0002-05's, and hash tree
# size is one of the things expected to differ between the two arms, so a
# number chosen here would prejudge a result there.
SizeMinBytes=64M
SizeMaxBytes=64M

# The detached signature partition is no longer absent: it arrived with its
# signing material at PLN-0002-06 and lives in 12-usr-verity-sig.conf beside
# this file. It was held back until then because `Verity=signature` needs
# signing material, whose lifetime across the task graph task 06 states, and
# because PLN-0002-10 is what needs the signature and the root hash to be
# separable so a substitution failure and a signature failure can be told
# apart.
