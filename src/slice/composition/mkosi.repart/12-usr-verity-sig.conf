# The detached signature over the root hash. PLN-0002-06.
#
# Promoted from src/spike/pln0002-01/mkosi.repart/12-usr-verity-sig.conf, which
# built one and booted it. PLN-0002-04 left this out deliberately and said so:
# it needs signing material, whose lifetime across the task graph is task 06's
# to state, so it arrives with that material rather than ahead of it.
#
# Shared across both arms, and it belongs in the shared directory rather than
# beside each 10-usr.conf because a signature over a root hash is not a property
# of the filesystem underneath it. An arm-specific copy would be a second
# variable moving alongside Format=.
#
# What this buys, stated narrowly. The root hash is already bound to the
# artifact through the signed UKI's command line, and that binding is what
# DES-0006 C-013 relies on. This partition is a *second, separable* binding, and
# separability is the point: PLN-0002-10 has to tell a substitution failure
# apart from a signature failure, and with only the UKI path both look like one
# refusal. It is also what systemd.image_policy=usr=signed can require, which is
# the parameter PLN-0002-05 declared and could not satisfy until this existed.
#
# It does not fix lazy verification. dm-verity still verifies per block on read,
# so a boot still proves only that the blocks the boot read are intact. See
# 11-usr-verity.conf.
[Partition]
Type=usr-verity-sig
Label=neutrinos-usr-verity-sig
Verity=signature
VerityMatchKey=usr
