# The machine-state volume. ADR-0005 puts /var here, and this is the first
# writable partition the project has ever built: every artifact before it ran
# root=tmpfs with nothing persistent, which is why ADR-0005 governed something
# that did not exist and why C-009 has never been measurable.
#
# This directory is passed only for the `state` variant, so it cannot change
# what a `primary` build produces. The six PLN-0002-06 artifacts are retained
# members and are not rebuilt.
[Partition]
Type=var
Label=neutrinos-var

# The UUID is not arbitrary and not a preference. The Discoverable Partitions
# Specification requires a /var partition's UUID to be
# HMAC-SHA256(key=machine-id, msg=the var GPT type UUID), truncated to 128 bits
# with the version and variant bits set as for a v4 UUID. systemd-gpt-auto-
# generator recomputes it and declines to mount a /var whose UUID does not
# match -- that is what stops one machine mounting another machine's state.
#
# The machine-id it is derived from is a harness fixture, declared once in
# compose.sh and delivered to the guest as the `system.machine_id` SMBIOS
# type 11 credential. The artifact carries no machine-id: PLN-0001's standing
# finding is that the harness supplies what the harness needs, and this follows
# it rather than baking an identity into a release artifact.
#
# repart takes no substitution, so this is a literal. It is checked rather than
# trusted: T2-STATE-001 recomputes it from the declared machine-id and fails on
# disagreement, so a machine-id change cannot silently leave a /var that never
# mounts again. The derivation was verified against systemd 261's own
# `systemd-id128 machine-id -a`, which returns the identical value.
UUID=f271751a-fbee-431d-983e-4ac0a980cc22

# Btrfs, and this is a fixture rather than an answer to C-009. C-009 is open
# and its candidate set is ext4, XFS and Btrfs; ext4 is already out for the
# criterion that motivates the question, because it has no reflink at all and
# so cannot serve the container and microVM workload the workstation capability
# declaration names. Btrfs is chosen here because it is one of the two real
# candidates AND it is already in the declared tools tree, so nothing about the
# declared input set has to move to get a writable partition booting.
#
# XFS is the other candidate and cannot be formatted by the current tools tree,
# which carries e2fsprogs and btrfs-progs but no xfsprogs. Adding it is a
# change to the declared input set and belongs to the task that measures C-009,
# not to this one.
#
# Read nothing into this. Repeated success is how a candidate becomes a
# decision without an ADR -- PR-0029 C-005 is the standing risk and this line
# is exactly its shape.
Format=btrfs

# Fixed, and slack rather than a measurement, on the same standard as the ESP.
# Sizing that means anything needs the C-009 workload to exist first.
SizeMinBytes=2G
SizeMaxBytes=2G
