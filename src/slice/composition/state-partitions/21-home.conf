# The home volume. Separate from the machine-state volume above, and ADR-0005
# is the reason: a volume boundary is earned by a custody, unlock, recovery,
# preservation or destruction difference, never by a path. This one is earned
# on preservation and destruction -- /var is machine state that a reinstall may
# discard, and /home is not -- so the boundary exists for a stated reason
# rather than because the two have different names.
[Partition]
Type=home
Label=neutrinos-home

# Unlike /var, the Discoverable Partitions Specification puts no derivation
# constraint on a /home partition's UUID: there is no equivalent of the
# one-machine-per-state rule, because a home volume is meant to be movable
# between machines. So this is repart's seed-derived UUID and nothing is
# declared here.
#
# The absence is deliberate and is not an oversight mirroring 20-var.conf. If a
# UUID= line ever appears here, it needs a reason that is not "the var file has
# one".

# Btrfs for the same fixture reason as /var, and the same warning applies. See
# 20-var.conf; the argument is not repeated so that changing it in one place
# cannot leave the other silently disagreeing.
Format=btrfs

SizeMinBytes=2G
SizeMaxBytes=2G

# Deliberately not encrypted. ADR-0007 makes routine unlock policy per role and
# names TPM2 + PIN for the workstation, and none of that is exercisable in a
# fixture with no TPM and no enrollment authority. An encrypted home here would
# be encryption with a key the harness hands over, which demonstrates nothing
# and would read as progress toward ADR-0007. The unencrypted volume is the
# honest state: the boundary exists, the custody policy does not yet.
