# The `neutrinos-network` configuration extension. PLN-0002-03a.
#
# Candidate, and handed back. The path carve this image owns -- /etc/systemd/
# network/ -- belongs to DES-0005, which owns path ownership and which has not
# drawn one. This is the first carve drawn, not the reference, and it is
# recorded that way in docs/project/etc-path-carve.md. The build tooling
# likewise belongs with the ADR-0003 spike. PR-0030 C-006 flags both as
# becoming the reference by being first; nothing here is entitled to that.
#
# Delivery is a **declared fixture of PLN-0002-03a**, not a decision: the image
# is placed at /usr/lib/confexts inside the authenticated artifact, per the
# owner ruling of 2026-08-11 on finding 1 option D. That fuses release and
# configuration, which is the opposite of what DES-0005's amendment separates,
# and it is accepted only because PLN-0002 measures formats and not delivery.
# PLN-0002-03b owns the design question. If any argument anywhere comes to
# depend on where this image lives, that is the stop condition.

[Distribution]
# No distribution, no repository, no packages. A confext carries configuration
# and nothing else, so it has no closure of its own and does not resolve
# anything -- which also means the repository outage cannot block building it.
#
# This is not a convenience. DES-0005 separates configuration from the release
# artifact, and an image that had to resolve the release's package repository
# to be built would have reintroduced the coupling at build time after removing
# it at delivery time.
Distribution=custom

[Output]
Format=confext
# The output name is load-bearing twice over: mkosi names the extension-release
# file after it, and systemd matches the two. A rename here that is not matched
# in mkosi.extra produces an image systemd refuses, which is the correct
# failure but an obscure one.
Output=neutrinos-network

# Same epoch as the composition, so the image identity depends on its content
# and not on when it was built.
SourceDateEpoch=0

# The same seed as the composition, by owner ruling of 2026-08-14.
#
# SourceDateEpoch= alone was not enough and its absence here was a real defect,
# measured rather than reasoned. mkosi's documented default is "otherwise, a
# random UUID is used", so without this systemd-repart randomised this image's
# partition UUIDs, filesystem UUID and verity salt on every build. The salt
# moves the root hash, the root hash moves the signature, and the whole confext
# changed -- 607 bytes across the GPT, both superblocks and the signature
# partition. Because compose.sh copies this image into /usr/lib/confexts inside
# the authenticated artifact, /usr changed with it, and so did usrhash and the
# artifact. That is how a missing seed on a 1 MiB extension broke the whole
# composition's build determinism.
#
# It went unnoticed because compose.sh's NEUTRINOS_SKIP_CONFEXT guard reuses a
# previously built confext, so a rebuild pair taken with it set is bit-identical
# while the defect is present. Any determinism evidence for this slice has to
# state whether the confext was rebuilt, or it does not mean what it says.
Seed=3f2a6d1c-8e4b-4a7f-9c15-2b6d0e5a71c4

[Validation]
# dm-verity with a signature, which is what image_policy_confext_strict
# requires and what DES-0006 C-013 assumes when it makes signed confexts the
# only configuration delivery mechanism. `hash` would produce an image that
# merges under a laxer policy and would quietly not be the thing under test.
#
# The key and certificate are supplied by compose.sh on the command line. They
# are synthetic, live in the build root, are never enrolled anywhere, and are
# the same pair the artifact's verity signature uses. Sharing them is a fixture
# property and not a claim: whether configuration and release should share a
# signing key is exactly what DES-0005's independent-signing question asks, and
# RES-0015 found upstream evidence pointing the other way. Sharing here decides
# nothing and must not be read as an answer.
Verity=signed
