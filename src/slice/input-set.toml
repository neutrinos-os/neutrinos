# Declared input set for the PLN-0001 reference-VM slice.
#
# Validated by T2-SLICE-001 against the schema its own [schema] block declares,
# currently schema/input-set-v2.schema.json. Every value here is an
# identity, not a preference: composition resolves exactly these inputs or
# fails. What makes each one exact is recorded in
# docs/project/slice-input-declaration.md.
#
# Nothing in this file accepts a mechanism. Fedora and mkosi are candidate
# fixtures under PLN-0001 and remain candidates however many times they work.

[schema]
id = "neutrinos.slice.input-set"
version = 3

[source]
repository = "https://github.com/neutrinos-os/neutrinos"
revision = "874e9c7709984a37eebde1fddbe6af49a2d29109"

[packages]
distribution = "fedora"
release = "44"
architecture = "x86_64"

# Exactly one repository. The Fedora release tree is frozen at GA, so its
# metadata is a stable identity. `updates` is deliberately absent: it is
# republished continuously and cannot be an exact input. Omitting it means the
# slice builds GA package versions and nothing newer, which is the intended
# cost of exactness rather than an oversight.
[[packages.repositories]]
name = "fedora"
url = "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os"
metadata_digest = "da3845427d188097f6fd71b417a039bdfb8efefc4f38ca44b5cbb94f95a18991"
metadata_revision = "1776864872"
frozen = true

# The one deviation from the release closure, added by PLN-0002-02 and declared
# rather than arranged. Fedora 44 ships systemd 259.5 and stays on the 259.x
# series; DES-0006 C-013 names systemd-confext-sysroot.service as the mechanism
# that merges a confext into the real /etc before switch-root, and that unit is
# new in systemd 261. The closure as declared cannot reach it.
#
# It arrives as a local package directory, not as a second repository, so
# LocalMirror= keeps enforcing "exactly one repository exists" by construction.
# F-RES-01 is this project's own recorded evidence that convention does not hold
# in that position.
#
# The source is a nightly and upstream replaces it in place. The digests below
# are therefore the input and the URL is only where it came from: compose.sh
# verifies every file against them and fails closed on a mismatch, so an
# upstream rebuild becomes a stopped build rather than a silent substitution.
[[packages.overlays]]
name = "systemd-261"
source = "https://download.opensuse.org/repositories/system:/systemd/Fedora_44/x86_64"
reason = "DES-0006 C-013 requires systemd-confext-sysroot.service, new in systemd 261; Fedora 44 stays on 259.x"

[[packages.overlays.files]]
name = "systemd-261.999+1208+g827144298-4747.1.x86_64.rpm"
sha256 = "3b0cffe5baa523cee165ead190c29458544d13e97ec0e0e71ea7c00aa62c9d3f"

[[packages.overlays.files]]
name = "systemd-boot-261.999+1208+g827144298-4747.1.x86_64.rpm"
sha256 = "e7744cf72728bbdeb875cc5be9fa65a229af529818d82bc765eedfe228cb9b3c"

[[packages.overlays.files]]
name = "systemd-libs-261.999+1208+g827144298-4747.1.x86_64.rpm"
sha256 = "45447b7596dbb1b517aa53ad28ee300ca8ada7e3a79816b43c40075033036799"

[[packages.overlays.files]]
name = "systemd-shared-261.999+1208+g827144298-4747.1.x86_64.rpm"
sha256 = "260b09775ce0ec3b61517fd18a29e2b6eb4b4d7fdd6a96050502f57ea3b41444"

[[packages.overlays.files]]
name = "systemd-sysusers-261.999+1208+g827144298-4747.1.x86_64.rpm"
sha256 = "50d90ca8d1f0ad302882434cfe82262c013e31b4fd7502c87df262faed5b1f27"

[[packages.overlays.files]]
name = "systemd-udev-261.999+1208+g827144298-4747.1.x86_64.rpm"
sha256 = "878d3ce97b3e40b307ff64bfb85af5c02e203f96e262291c21ea11920d1d22da"

[[tools]]
name = "mkosi"
version = "v26"
identity_kind = "git-commit"
identity = "84af20892b61c8e177e391f997ded8b4cb5514f2"
note = "Candidate composition fixture. Commit is the v26 annotated tag dereferenced; the tag itself is mutable."

# The tools tree supplies dnf5 and rpm, which resolve and install every package
# in the image. It is built from the frozen repository declared above, not from
# the build host's rolling distribution, so no undeclared moving input decides
# image contents. It is declared by recipe rather than by digest: exporting the
# tree produces unstable timestamps, so its own digest would change without any
# input changing.
[tools_tree]
base_image = "registry.fedoraproject.org/fedora@sha256:93f227979b6ef8395cde2a38dee260ef4cbecaab7668ee45d97960aba910e918"
package_source = "fedora"
packages = [
  "distribution-gpg-keys",
  "cpio",
  "systemd",
  "systemd-ukify",
  "systemd-boot",
  "dosfstools",
  "mtools",
  "e2fsprogs",
  "erofs-utils",
  "btrfs-progs",
  "squashfs-tools",
  "tar",
  "zstd",
  "xz",
  "python3",
  # Added by PLN-0002-02. mkosi turns the declared package overlay into a local
  # repository with createrepo_c, and without it the build stops after syncing
  # metadata.
  "createrepo_c",
]

# QEMU is deliberately absent. It executes the artifact but cannot change what
# composition produces, and this record declares composition inputs only. The
# boot tool's identity is PLN-0001-03's evidence, recorded with the boot rather
# than pinned here where nothing would check it.

[intent]
role = "qualification"
machine = "slice-vm-01"
layers = ["common", "role", "machine"]
