sha256 = "86d0f0a0548ca676debf24779beca83fc2e1659d1e624c5c79fd4c387d862a37"

# uwsm is absent from the Fedora 44 GA closure, measured against this file's
# own repository index (C-011). It is a candidate for capability.session-lifecycle
# in src/roles/workstation/capabilities.toml, replacing the hand-written units
# that capability declared while uwsm resolved nowhere. Pulled from a COPR build
# rather than the frozen repository above, same reason as the systemd-261
# overlay: it is the one way a package enters the image without a second
# repository existing, and the digest is what makes the source URL not the
# input.
#
# fedora-44-x86_64 is a real chroot in this COPR project (solopasha/hyprland
# only publishes fedora-rawhide-x86_64 and was not usable). Runtime
# dependencies -- fuzzel, libnotify, python3-dbus, python3-pyxdg, util-linux --
# all resolve from the Fedora 44 closure declared above; fuzzel is already a
# declared package (capability.launcher).
[[packages.overlays]]
name = "uwsm"
source = "https://download.copr.fedorainfracloud.org/results/pabrahamsson/hyprland/fedora-44-x86_64/08831437-uwsm"
reason = "capability.session-lifecycle names uwsm as the transcript's selection; absent from the Fedora 44 GA closure (C-011)"

[[packages.overlays.files]]
name = "uwsm-0.21.3-1.x86_64.rpm"
sha256 = "7d498bf82299a03ace393cc96342fc86951d5934f5e2b354658aba44f9f6d069"

[[tools]]
name = "mkosi"
version = "main@2026-08-18"
identity_kind = "git-commit"
identity = "9b7d87a1707e39a42cfb54dce5cf745ef7b99a7e"
note = """Candidate composition fixture, pinned to a commit rather than a branch.

Paired deliberately with the systemd-261 overlay above. That overlay is the OBS
system:systemd project, which builds systemd from upstream main, and the RPMs
declared here are the 2026-08-18 snapshot g57c4a1ea3. The previous pin was
d5ff0d0d, 2026-08-11, paired twenty minutes apart with the 4747.1 systemd
snapshot; both moved together on 2026-08-18 when 4747.1 rotated off OBS
(see the overlay's own note) and the systemd-container package the `workload`
variant needs had to come from whatever snapshot was current. This commit's
committer date is 2026-08-18 12:33 UTC and the systemd snapshot's is 17:46
UTC, five hours apart -- not the twenty minutes the previous pair achieved
(mkosi main was not moving every twenty minutes at the hour this was pinned),
but the same day and the closest mkosi commit available, checked against
upstream's commit history rather than assumed contemporaneous.

The pairing is the reason both lines exist and must move together: bumping one
without the other reintroduces the skew. ParticleOS, whose configuration this
follows, declares MinimumVersion=26~devel and tracks mkosi main alongside the
same OBS repository.

Pinned to a commit, not to main, and not to a tag: an annotated tag is mutable
and a branch is not an input at all."""

# The tools tree supplies dnf5 and rpm, which resolve and install every package
# in the image. It is built from the frozen repository declared above, not from
# the build host's rolling distribution, so no undeclared moving input decides
# image contents. It is declared by recipe rather than by digest: exporting the
# tree produces unstable timestamps, so its own digest would change without any
# input changing.
[tools_tree]
base_image = "registry.fedoraproject.org/fedora@sha256:93f227979b6ef8395cde2a38dee260ef4cbecaab7668ee45d97960aba910e918"
package_source = "fedora"
packages = [
  "distribution-gpg-keys",
  "cpio",
  "systemd",
  "systemd-ukify",
  "systemd-boot",
  "dosfstools",
  "mtools",
  "e2fsprogs",
  "erofs-utils",
  "btrfs-progs",
  # Added for C-009 (state-filesystem candidate set: ext4, XFS, Btrfs). The
  # tools tree previously carried e2fsprogs and btrfs-progs but no xfsprogs, so
  # XFS could not be formatted at all -- state-partitions/20-var.conf names
  # this as the tools-tree gap blocking a second candidate from being built.
  # xfsprogs-6.18.0-2.fc44.x86_64 and its runtime deps (libedit, inih,
  # userspace-rcu; libblkid/libuuid already resolve) are measured present in
  # the frozen Fedora 44 GA closure -- no overlay needed, unlike uwsm.
  "xfsprogs",
  "squashfs-tools",
  "tar",
  "zstd",
  "xz",
  "python3",
  # Added by PLN-0002-02. mkosi turns the declared package overlay into a local
  # repository with createrepo_c, and without it the build stops after syncing
  # metadata.
  "createrepo_c",
]

# QEMU is deliberately absent. It executes the artifact but cannot change what
# composition produces, and this record declares composition inputs only. The
# boot tool's identity is PLN-0001-03's evidence, recorded with the boot rather
# than pinned here where nothing would check it.

[intent]
role = "qualification"
machine = "slice-vm-01"
layers = ["common", "role", "machine"]
