# Throwaway composition fixture for PLN-0002-01, the early-boot spike.
#
# This is not the plan's composition. PLN-0002-02 owns that, and it starts from
# src/slice/composition rather than from here. This file exists to answer one
# question as cheaply as possible: does the /usr-only boot path DES-0006 C-013
# accepted work at all, and do the units C-013 names behave as it assumed.
#
# It is deliberately not held to the slice's declaration discipline. The slice
# declares its inputs in src/slice/input-set.toml and enforces them by
# construction; this spike reuses the same frozen repository and tools tree but
# adds an overlay, and PLN-0002-02 is where that overlay becomes declared.
# Nothing built here is evidence for anything except the early-boot question.

[Distribution]
Distribution=fedora
Release=44

# Same frozen repository as the slice, same reason: `updates` is republished
# continuously and cannot be an exact input. The systemd overlay arrives through
# PackageDirectories= instead of a second repository, so this stays the only
# repository that exists and LocalMirror keeps enforcing that by construction.
# F-RES-01 is the recorded evidence that convention does not hold here.
LocalMirror=https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os

[Output]
Format=disk
Output=pln0002-01
ManifestFormat=json
# Same seed as the slice: repart derives partition and filesystem UUIDs from it
# by hashing rather than randomly.
Seed=3f2a6d1c-8e4b-4a7f-9c15-2b6d0e5a71c4
# The roothash is written out separately so the spike can compare what the UKI
# carries against what repart actually produced, rather than trusting that
# mkosi's injection happened.
SplitArtifacts=uki,partitions,roothash

[Content]
Bootable=yes

# Owner ruling 2026-08-11: the root partition is tmpfs. Nothing persists, so no
# machine-state volume is built and C-008 is respected by not implementing the
# thing it governs.
#
# root=tmpfs is what makes that true at boot: the initrd creates a tmpfs for
# /sysroot and mounts /usr into it from the usr partition. usrhash= is injected
# by mkosi from repart's JSON output, and it is what makes the mount
# verity-authenticated -- without it the usr partition would mount unverified.
KernelCommandLine=root=tmpfs
                  rw
                  console=ttyS0

# The overlay. Fedora 44 ships systemd 259.5 and stays on the 259.x series;
# systemd-confext-sysroot.service is new in 261, so the closure as declared
# cannot exercise the mechanism C-013 names. These are the OBS system:systemd
# builds for Fedora 44, retained locally with digests by spike.sh.
# The directory itself is supplied by spike.sh on the command line: mkosi has
# no specifier for a path outside the checkout, and build artifacts never enter
# it. spike.sh is also what retains the RPMs and records their digests.

Packages=systemd,systemd-boot,systemd-udev,kernel-core,util-linux-core,dbus-broker

# Same epoch as the slice, for the same reason.
SourceDateEpoch=0

[Validation]
# Synthetic, generated by spike.sh into the build root. Not a trust anchor, not
# enrolled anywhere, and regenerated freely. The plan's boundary forbids any
# real signing material and this spike has no need of it: what is under test is
# whether the binding mechanism works, not whose key signs it.
SecureBoot=yes
# Key and certificate paths are supplied by spike.sh, for the same reason as
# the package directory above.
