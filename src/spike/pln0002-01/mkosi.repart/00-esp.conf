# The ESP carries the signed UKI and nothing else. It is unauthenticated by
# construction; what protects it is that the UKI it holds is signed and the
# firmware checks that signature, not that the partition is trusted.
[Partition]
Type=esp
Format=vfat
# Both, not just /boot. mkosi stages the UKI under /boot and the bootloader
# under /efi; copying only /boot produced an ESP with a valid UKI and no
# EFI/BOOT/BOOTX64.EFI, so the firmware fell through to PXE and the artifact
# looked unbootable for a reason that had nothing to do with /usr.
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
