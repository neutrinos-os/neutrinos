# The hash tree. Its root hash is what the signed UKI carries on the kernel
# command line, which is the binding C-013 relies on: the signature covers the
# command line, the command line names the root hash, the root hash covers
# every block of the usr partition.
[Partition]
Type=usr-verity
Label=pln0002-01-verity
Verity=hash
VerityMatchKey=usr
# The hash tree needs room. Left unsized, repart allocates the 4K default and
# fails with "Partition 2's contents (1.9M) don't fit in the partition (4K)".
# 64M is slack, not a measurement; PLN-0002-05 declares real sizing for both
# arms, and the tree size is one of the things that differs between formats.
SizeMinBytes=64M
SizeMaxBytes=64M
